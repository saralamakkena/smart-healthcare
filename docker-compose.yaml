version: '3.8'
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: sh_user
      POSTGRES_PASSWORD: 
      POSTGRES_DB: smart_health
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data
    ports: ["9000:9000"]
volumes:
  pgdata:
